mode = "hub"
database = "/var/lib/telegraff/state.sqlite"
target = "hub.example.net"
# Set to 443 when nginx serves HTTPS and UDP is separately forwarded on 443.
# public_port = 443
tcp_listen = ["127.0.0.1:9477", "[::1]:9477"]
udp_listen = ["127.0.0.1:9477", "[::1]:9477"]
retention_days = 30
reminder_seconds = 21600
max_connections = 64
max_assemblies = 256

[ntfy]
endpoint = "https://ntfy.example.net/telegraff"
# token_file = "/etc/telegraff/ntfy.token"

# Native TLS: use when nginx stream passes TLS through to this TCP listener.
# Omit this table when nginx terminates TLS and proxies plain HTTP instead.
# [tls]
# Paths default to /etc/letsencrypt/live/<target>/. Uncomment [tls] alone to enable.
# certificate_file = "/etc/letsencrypt/live/hub.example.net/fullchain.pem"
# private_key_file = "/etc/letsencrypt/live/hub.example.net/privkey.pem"
