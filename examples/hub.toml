mode = "hub"
database = "/var/lib/telegraff/state.sqlite"
target = "hub.example.net"
# Set to 443 when nginx serves HTTPS and UDP is separately forwarded on 443.
# public_port = 443
tcp_listen = ["127.0.0.1:9477", "[::1]:9477"]
udp_listen = ["127.0.0.1:9477", "[::1]:9477"]
retention_days = 30
reminder_seconds = 21600
max_connections = 64
max_assemblies = 256

[ntfy]
endpoint = "https://ntfy.example.net/telegraff"
# token_file = "/etc/telegraff/ntfy.token"
